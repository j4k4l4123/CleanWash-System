<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="drumShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#cwGrad)" />
  
  <!-- Machine Outline -->
  <rect x="13" y="10" width="38" height="44" rx="6" stroke="#ffffff" stroke-width="3" fill="none" />
  
  <!-- Machine Top Separator -->
  <line x1="13" y1="21" x2="51" y2="21" stroke="#ffffff" stroke-width="2.5" />
  
  <!-- Control Buttons -->
  <circle cx="20" cy="15.5" r="2" fill="#ffffff" />
  <circle cx="26" cy="15.5" r="2" fill="#ffffff" />
  <rect x="36" y="14" width="9" height="3.5" rx="1.5" fill="#ffffff" />
  
  <!-- Drum Circle -->
  <circle cx="32" cy="36" r="11" stroke="#ffffff" stroke-width="3" fill="url(#drumShine)" />
  
  <!-- Water Wave inside drum -->
  <path d="M25 36.5c2.2-2.5 4.8-2.5 7 0s4.8 2.5 7 0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
  
  <!-- Bubbles -->
  <circle cx="32" cy="30.5" r="1.6" fill="#ffffff" />
  <circle cx="36" cy="32.5" r="1.1" fill="#ffffff" />
</svg>