services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: laundry_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: LaundryDB
      DB_USERNAME: postgres
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laundry_network

  web:
    image: nginx:alpine
    container_name: laundry_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laundry_network

  db:
    image: postgres:16-alpine
    container_name: laundry_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: LaundryDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - laundry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d LaundryDB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - laundry_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: laundry_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@laundry.test
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - laundry_network

volumes:
  laundry_pgdata:
    driver: local

networks:
  laundry_network:
    driver: bridge
